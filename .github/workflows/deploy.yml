name: Deploy a Cloudflare Pages

# Cada push a main publica el sitio (mismo `wrangler pages deploy` del script
# deploy, pero en CI). El proyecto sigue siendo Direct Upload: no toca sus
# secretos ni su dominio, solo sube una versión nueva.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Aborta ANTES de construir/desplegar si falta un secreto: así nunca se
      # publica una web sin Supabase ni se intenta deploy sin token.
      - name: Verificar secretos
        run: |
          : "${PUBLIC_SUPABASE_URL:?Falta el secret PUBLIC_SUPABASE_URL}"
          : "${PUBLIC_SUPABASE_ANON_KEY:?Falta el secret PUBLIC_SUPABASE_ANON_KEY}"
          : "${CLOUDFLARE_API_TOKEN:?Falta el secret CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Falta el secret CLOUDFLARE_ACCOUNT_ID}"
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_BARBERIA: ${{ vars.PUBLIC_BARBERIA || 'B1' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://labarberiaestadio.pages.dev' }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ secrets.PUBLIC_CF_ANALYTICS_TOKEN }}
      # wrangler lee CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID del entorno.
      - run: npx wrangler pages deploy dist --project-name labarberiaestadio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
